name: Python CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  release:
    types: [created]    
  workflow_dispatch:

jobs:
  validation:
    uses: microsoft/action-python/.github/workflows/validation.yml@00afd9876614ecf1b756489fdc3b604e92dee27d # 0.7.3
    with:
      workdir: '.'

  publish:
    uses: microsoft/action-python/.github/workflows/publish.yml@7d2126865ee9d3da8022d8a71c51734337eeae53 # 0.6.4
    secrets:
      PYPI_PASSWORD: ${{ secrets.PYPI_PASSWORD }}
      TEST_PYPI_PASSWORD: ${{ secrets.TEST_PYPI_PASSWORD  }}
